[workspace]
resolver = "3"
members = ["gateway", "order-service", "payment-service"]

[workspace.dependencies]
axum = "0.8.8"
clap = { version = "4.6.0", features = ["derive"] }
config = { version = "0.15.22", features = ["toml"] }
http = "1.4.0"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.51.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa-swagger-ui = "9.0.2"
uuid = { version = "1.23.0", features = ["v4"] }
